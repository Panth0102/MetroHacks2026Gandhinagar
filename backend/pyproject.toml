[project]
name = "metro-revenue-intelligence"
version = "0.1.0"
description = "Phase 1 backend for Metro Revenue Intelligence (Metro Hacks PS-06: Footfall to Revenue)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pandas>=2.2",
    "numpy>=2.1",
    "python-dotenv>=1.0",
    "reportlab>=4.2",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "pypdf>=5.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008: FastAPI uses `Depends(...)`/`Query(...)` as argument defaults by design.
# UP042: `str, Enum` mixins are intentional for SQLAlchemy String-column storage.
ignore = ["B008", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
